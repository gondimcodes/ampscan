[package]
name = "ampscan"
version = "1.4.7"
edition = "2021"
description = "DDoS Amplification Port Testing Tool with TUI"
authors = ["Marcelo Gondim"]

[dependencies]
# TUI Framework
ratatui = "0.30"
crossterm = "0.28"

# CLI framework
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Password hashing (Argon2id)
argon2 = "0.5"

# IP prefix/CIDR handling
ipnet = "2"

# PDF report generation (low-level, built-in fonts, zero external deps)
printpdf = { version = "0.12.5", default-features = false, features = ["png"] }
image = { version = "0.25.5", default-features = false, features = ["png"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Random number generation
rand = "0.8"

# Colored terminal output
colored = "2"

# Secure password input (no echo)
rpassword = "7"

# UUID for scan identifiers
uuid = { version = "1", features = ["v4"] }

# Terminal table formatting
comfy-table = "7"

# Unix system limits
libc = "0.2"

# Secure memory zeroization (clears sensitive data from heap after use)
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(all(not(windows), not(all(target_os = "linux", target_arch = "aarch64"))))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
