name: CD (Automatic Release)

on:
  push:
    tags:
      - 'v*' # Dispara quando uma tag começando com v é criada (ex: v1.3.1)
  workflow_dispatch: # Permite disparar o build manualmente pela aba Actions no GitHub

permissions:
  contents: write # Permissão necessária para publicar na aba de Releases

jobs:
  build-and-release:
    name: Build and Release for ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      matrix:
        job:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: ampscan
            asset_ext: tar.gz
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: ampscan
            asset_ext: tar.gz
            use_cross: true
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: ampscan.exe
            asset_ext: zip
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: ampscan
            asset_ext: tar.gz
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: ampscan
            asset_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cross
        if: matrix.job.use_cross
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up MSVC Developer Command Prompt (for OpenSSL build on Windows)
        if: matrix.job.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}

      - name: Set up Perl (for OpenSSL build on Windows)
        if: matrix.job.os == 'windows-latest'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.38'
          distribution: strawberry

      - name: Build release binary (standard)
        if: "!matrix.job.use_cross"
        env:
          OPENSSL_RUST_USE_NASM: "0"
        run: cargo build --release --target ${{ matrix.job.target }}

      - name: Build release binary (cross)
        if: matrix.job.use_cross
        run: cross build --release --target ${{ matrix.job.target }}

      - name: Package binary (Unix)
        if: startsWith(matrix.job.os, 'ubuntu') || startsWith(matrix.job.os, 'macos')
        run: |
          cd target/${{ matrix.job.target }}/release
          tar -czf ../../../ampscan-${{ github.ref_name }}-${{ matrix.job.target }}.${{ matrix.job.asset_ext }} ${{ matrix.job.binary_name }}
          cd -

      - name: Package binary (Windows)
        if: matrix.job.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.job.target }}/release
          7z a ../../../ampscan-${{ github.ref_name }}-${{ matrix.job.target }}.${{ matrix.job.asset_ext }} ${{ matrix.job.binary_name }}
          cd -

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ampscan-${{ github.ref_name }}-*.tar.gz
            ampscan-${{ github.ref_name }}-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-freebsd:
    name: Build and Release for x86_64-unknown-freebsd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust pkgconf openssl
          run: |
            export CFLAGS="-I/usr/local/include"
            export LDFLAGS="-L/usr/local/lib"
            export OPENSSL_DIR="/usr/local"
            export OPENSSL_LIB_DIR="/usr/local/lib"
            export OPENSSL_INCLUDE_DIR="/usr/local/include"
            cargo build --release
            cd target/release
            tar -czf ../../ampscan-${{ github.ref_name }}-x86_64-unknown-freebsd.tar.gz ampscan

      - name: Publish FreeBSD Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ampscan-${{ github.ref_name }}-x86_64-unknown-freebsd.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
